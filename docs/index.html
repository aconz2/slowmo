<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="manifest.json" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            margin: 0;
        }
        .row {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            min-height: 0;
        }
        video, canvas {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }
        #seek {
            width: 100%;
        }
        .hide { display: none; }
        #canvasWrite { touch-action: none; }
    </style>
  </head>
    <body>
        <div class="row" style="flex-shrink: 0; padding: 5px 0;">
            <input type="range" id="seek" min="0" max="100" step="0.1" value="0" />
            <input type="number" id="nframes" min="1" max="100" step="1" value="30" />
        </div>
        <div class="row" style="flex-shrink: 0; padding-bottom: 5px;">
            <input type="file" id="file" accept="video/*" />
        </div>
        <div class="row">
            <video>
            </video>
        </div>
        <div class="hide row">
            <canvas id="canvasWrite"></canvas>
        </div>
        <div class="hide">
            <canvas id="canvasRead"></canvas>
        </div>
    </body>
    <script src="main.js"></script>
</script>
